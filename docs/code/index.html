<script>
// 主题切换逻辑
(function() {
  'use strict';
  
  const STORAGE_KEY = 'site-theme';
  
  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }
  
  function setStoredTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
  }
  
  function getPreferredTheme() {
    const stored = getStoredTheme();
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  
  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      document.body.classList.add('quarto-dark');
      document.body.classList.remove('quarto-light');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('quarto-dark');
      document.body.classList.add('quarto-light');
    }
  }
  
  // 查找主题切换按钮的多种方式
  function findToggleButton() {
    // 方式1: 通过图标类名查找
    const icon = document.querySelector('i.bi-circle-half, .bi-circle-half');
    if (icon) {
      const btn = icon.closest('a');
      if (btn) return btn;
    }
    
    // 方式2: 通过 aria-label 查找
    const btnByLabel = document.querySelector('[aria-label="切换主题"], [aria-label="Toggle theme"]');
    if (btnByLabel) return btnByLabel;
    
    // 方式3: 通过 data-theme-toggle 属性查找
    const btnByAttr = document.querySelector('[data-theme-toggle]');
    if (btnByAttr) return btnByAttr;
    
    // 方式4: 查找导航栏中包含 circle-half 图标的链接
    const navLinks = document.querySelectorAll('.navbar a.nav-link');
    for (const link of navLinks) {
      if (link.querySelector('.bi-circle-half') || link.querySelector('i[class*="circle"]')) {
        return link;
      }
    }
    
    return null;
  }
  
  // 绑定点击事件
  function bindToggleButton() {
    const toggleBtn = findToggleButton();
    if (toggleBtn) {
      toggleBtn.id = 'theme-toggle';
      // 移除可能的默认行为
      toggleBtn.setAttribute('href', '#');
      
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const isDark = document.documentElement.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        applyTheme(newTheme);
        setStoredTheme(newTheme);
        // 触发自定义事件以便其他组件响应
        document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: newTheme } }));
      });
      
      return true;
    }
    return false;
  }
  
  // 初始化主题
  const initialTheme = getPreferredTheme();
  applyTheme(initialTheme);
  setStoredTheme(initialTheme);
  
  // 立即尝试绑定
  if (!bindToggleButton()) {
    // 如果立即绑定失败，等待DOM加载完成后重试
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindToggleButton);
    } else {
      // 延迟一点时间后重试
      setTimeout(bindToggleButton, 100);
    }
  }
  
  // 监听系统主题变化
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!getStoredTheme()) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });
})();
</script>
<script>
/**
 * 分类功能增强脚本 v2.0
 * 功能包括：
 * 1. 全局分类索引存储，解决分类同步问题
 * 2. 详情页文本输入框自定义分类
 * 3. 列表页动态显示所有已添加的分类
 * 4. 点击分类可筛选对应文章
 * 5. 完整输入验证和成功反馈
 */
(function() {
  'use strict';

  // 存储键名
  const CATEGORY_INDEX_KEY = 'site-categories-index';    // { "分类名": ["postId1", ...] }
  const POST_CATEGORIES_KEY = 'site-post-categories';    // { "postId": ["分类1", ...] }

  // ---------- 数据层：全局分类索引 ----------

  // 读取全局分类索引
  function getCategoryIndex() {
    return JSON.parse(localStorage.getItem(CATEGORY_INDEX_KEY) || '{}');
  }

  // 保存全局分类索引
  function saveCategoryIndex(index) {
    localStorage.setItem(CATEGORY_INDEX_KEY, JSON.stringify(index));
  }

  // 获取某篇文章的分类
  function getPostCategories(postId) {
    const all = JSON.parse(localStorage.getItem(POST_CATEGORIES_KEY) || '{}');
    return all[postId] || [];
  }

  // 保存某篇文章的分类（同时更新全局索引）
  function savePostCategories(postId, categories) {
    // 1. 更新文章->分类映射
    const allPosts = JSON.parse(localStorage.getItem(POST_CATEGORIES_KEY) || '{}');
    allPosts[postId] = categories;
    localStorage.setItem(POST_CATEGORIES_KEY, JSON.stringify(allPosts));

    // 2. 重建全局索引（确保数据一致性）
    rebuildCategoryIndex();

    // 3. 触发事件
    document.dispatchEvent(new CustomEvent('post-categories-changed', {
      detail: { postId, categories }
    }));
  }

  // 重建全局分类索引
  function rebuildCategoryIndex() {
    const allPosts = JSON.parse(localStorage.getItem(POST_CATEGORIES_KEY) || '{}');
    const index = {};

    for (const [postId, cats] of Object.entries(allPosts)) {
      for (const cat of cats) {
        if (!index[cat]) {
          index[cat] = [];
        }
        if (!index[cat].includes(postId)) {
          index[cat].push(postId);
        }
      }
    }

    saveCategoryIndex(index);
  }

  // 获取所有分类列表（按使用频率排序）
  function getAllCategories() {
    const index = getCategoryIndex();
    return Object.keys(index).sort((a, b) => {
      return (index[b] || []).length - (index[a] || []).length;
    });
  }

  // 获取属于某个分类的文章ID列表
  function getPostsByCategory(category) {
    const index = getCategoryIndex();
    return index[category] || [];
  }

  // 获取当前页面的文章列表（用于筛选）
  function getListedPostIds() {
    const posts = document.querySelectorAll('.quarto-listing .quarto-post');
    const ids = [];
    posts.forEach(post => {
      const link = post.querySelector('.listing-title a, a[href]');
      if (link) {
        const href = link.getAttribute('href') || '';
        // 从href提取post ID（文件名）
        const postId = href.split('/').pop()?.replace('.html', '') || '';
        if (postId) ids.push(postId);
      }
    });
    return ids;
  }

  // ---------- 验证层 ----------

  function validateCategoryInput(input) {
    const trimmed = input.trim();
    if (!trimmed) {
      return { valid: false, message: '分类名称不能为空' };
    }
    if (trimmed.length > 30) {
      return { valid: false, message: '分类名称不能超过30个字符' };
    }
    const validPattern = /^[\u4e00-\u9fa5a-zA-Z0-9\s_-]+$/;
    if (!validPattern.test(trimmed)) {
      return { valid: false, message: '分类名称只能包含中文、英文、数字、空格、下划线和短横线' };
    }
    if (!trimmed.replace(/\s/g, '').length) {
      return { valid: false, message: '分类名称不能为纯空格' };
    }
    return { valid: true, value: trimmed };
  }

  // ---------- 详情页：分类输入器 ----------

  // 判断当前页面是否应跳过分类输入器（如"关于"页面等非文章内容页）
  function shouldSkipCategorySelector() {
    const path = window.location.pathname.toLowerCase();
    const pageId = getCurrentPageId().toLowerCase();
    // 排除"关于"页面、首页索引等非文章详情页
    const skipPages = ['about', 'index'];
    if (skipPages.includes(pageId)) return true;
    if (path.endsWith('/about.html') || path.endsWith('/about')) return true;
    return false;
  }

  function buildPageCategorySelector() {
    // 只在非 listing 页面显示
    if (document.querySelector('.quarto-listing')) return;
    // 跳过"关于"等非文章详情页
    if (shouldSkipCategorySelector()) return;

    const existing = document.querySelector('.page-category-selector');
    if (existing) existing.remove();

    const pageId = getCurrentPageId();
    const currentCats = getPostCategories(pageId);

    const selector = document.createElement('div');
    selector.className = 'page-category-selector';
    selector.innerHTML = `
      <span class="label">📌 本篇分类：</span>
      <div class="current-categories">
        ${renderCatTags(currentCats)}
      </div>
      <div class="category-input-wrapper">
        <input 
          type="text" 
          class="category-input" 
          placeholder="输入自定义分类名称，按回车添加..." 
          maxlength="30"
          autocomplete="off"
        >
        <button type="button" class="submit-category">
          <span>＋</span> 添加
        </button>
      </div>
      <div class="category-error" style="display:none;"></div>
    `;

    const title = document.querySelector('#title-block-header, main.content h1.title');
    if (title && title.parentNode) {
      title.parentNode.insertBefore(selector, title.nextSibling);
    } else {
      const main = document.querySelector('main.content');
      if (main) main.prepend(selector);
    }

    bindSelectorEvents(selector, pageId);
  }

  function getCurrentPageId() {
    const pathname = window.location.pathname;
    // 获取最后一个路径段
    const lastSegment = pathname.split('/').filter(Boolean).pop() || 'page';
    // 移除 .html 扩展名
    return lastSegment.replace(/\.html$/, '');
  }

  function renderCatTags(categories) {
    if (!categories || categories.length === 0) {
      return '<span class="empty-hint">暂无分类，请在下方输入</span>';
    }
    return categories.map(cat => `
      <span class="cat-tag" data-cat="${escapeHtml(cat)}">
        ${escapeHtml(cat)}
        <span class="remove" title="移除">×</span>
      </span>
    `).join('');
  }

  function bindSelectorEvents(selector, pageId) {
    const input = selector.querySelector('.category-input');
    const submitBtn = selector.querySelector('.submit-category');
    const errorDiv = selector.querySelector('.category-error');
    const currentCatsDiv = selector.querySelector('.current-categories');

    // 绑定已有标签的移除事件
    bindTagRemoveEvents(currentCatsDiv, pageId);

    // 提交分类
    submitBtn.addEventListener('click', () => submitCategory(input, errorDiv, currentCatsDiv, pageId));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitCategory(input, errorDiv, currentCatsDiv, pageId);
      }
    });

    // 输入时清除错误
    input.addEventListener('input', () => {
      if (input.classList.contains('input-error')) {
        hideError(errorDiv);
        input.classList.remove('input-error');
      }
    });
  }

  function submitCategory(input, errorDiv, currentCatsDiv, pageId) {
    const value = input.value;
    const validation = validateCategoryInput(value);

    if (!validation.valid) {
      showError(errorDiv, validation.message);
      input.classList.add('input-error');
      return;
    }

    const newCat = validation.value;
    const existingCats = getPostCategories(pageId);

    if (existingCats.includes(newCat)) {
      showError(errorDiv, `分类"${newCat}"已存在`);
      input.classList.add('input-error');
      return;
    }

    const updatedCats = [...existingCats, newCat];
    savePostCategories(pageId, updatedCats);

    // 更新UI
    currentCatsDiv.innerHTML = renderCatTags(updatedCats);
    bindTagRemoveEvents(currentCatsDiv, pageId);

    // 清空输入
    input.value = '';
    hideError(errorDiv);
    input.classList.remove('input-error');

    // 成功反馈
    showSuccessToast(`已添加分类："${newCat}"`);

    // 同步更新列表页（如果在另一个标签页打开，通过storage事件）
    syncToOtherPages();
  }

  function bindTagRemoveEvents(container, pageId) {
    container.querySelectorAll('.cat-tag .remove').forEach(r => {
      r.addEventListener('click', () => {
        const tag = r.closest('.cat-tag');
        const cat = tag.dataset.cat;
        const cats = getPostCategories(pageId).filter(c => c !== cat);
        savePostCategories(pageId, cats);
        container.innerHTML = renderCatTags(cats);
        bindTagRemoveEvents(container, pageId);
        hideError(container.parentElement.querySelector('.category-error'));
      });
    });
  }

  // ---------- 列表页：动态分类同步 ----------

  function syncListPageCategories() {
    // 只在 listing 页面执行
    if (!document.querySelector('.quarto-listing')) return;

    const categories = getAllCategories();
    if (categories.length === 0) return;

    // 找到 Quarto 原生的分类容器
    const categoryContainer = document.querySelector('.quarto-listing-category');
    if (!categoryContainer) return;

    // 获取已存在的分类按钮
    const existingButtons = categoryContainer.querySelectorAll('.category');
    const existingCats = new Set();
    existingButtons.forEach(btn => {
      const cat = btn.getAttribute('data-category');
      if (cat) existingCats.add(cat);
    });

    // 添加缺失的分类
    categories.forEach(cat => {
      if (!existingCats.has(cat)) {
        addCategoryButton(categoryContainer, cat);
      }
    });

    // 更新"全部"按钮的计数
    updateCategoryCounts(categoryContainer);
  }

  function addCategoryButton(container, category) {
    const button = document.createElement('div');
    button.className = 'category';
    button.setAttribute('data-category', escapeHtml(category));
    button.innerHTML = `${escapeHtml(category)} <span class="quarto-category-count">(0)</span>`;

    // 添加点击事件（动态筛选）
    button.addEventListener('click', (e) => {
      e.stopPropagation();
      filterPostsByCategory(category, button);
    });

    container.appendChild(button);
  }

  function updateCategoryCounts(container) {
    const posts = document.querySelectorAll('.quarto-listing .quarto-post');
    const totalPosts = posts.length;

    // "全部"按钮显示总数
    const allBtn = container.querySelector('.category[data-category=""]');
    if (allBtn) {
      const countSpan = allBtn.querySelector('.quarto-category-count');
      if (countSpan) countSpan.textContent = `(${totalPosts})`;
    }

    // 更新每个分类的计数
    const postIds = getListedPostIds();
    const index = getCategoryIndex();

    container.querySelectorAll('.category').forEach(btn => {
      const cat = btn.getAttribute('data-category');
      if (!cat) return; // 跳过"全部"按钮

      const countSpan = btn.querySelector('.quarto-category-count');
      if (!countSpan) return;

      // 计算当前列表中属于该分类的文章数
      const postIdsForCat = index[cat] || [];
      const matchCount = postIds.filter(id => postIdsForCat.some(pid => pid.includes(id) || id.includes(pid))).length;
      countSpan.textContent = `(${matchCount})`;
    });
  }

  function filterPostsByCategory(category, clickedBtn) {
    const posts = document.querySelectorAll('.quarto-listing .quarto-post');
    const postIds = getListedPostIds();
    const index = getCategoryIndex();
    const matchedPostIds = new Set(index[category] || []);

    // 高亮选中的分类按钮
    const container = clickedBtn.parentElement;
    container.querySelectorAll('.category').forEach(btn => {
      btn.classList.remove('active');
      btn.removeAttribute('data-active');
    });

    // 如果点击的是已选中的分类或"全部"，则显示所有
    if (clickedBtn.classList.contains('active') || category === '') {
      posts.forEach(post => {
        post.style.display = '';
      });
      if (category === '') {
        clickedBtn.classList.add('active');
        clickedBtn.setAttribute('data-active', 'true');
      }
      showNoMatching(posts.length === 0);
      return;
    }

    // 高亮当前按钮
    clickedBtn.classList.add('active');
    clickedBtn.setAttribute('data-active', 'true');

    // 根据分类筛选文章
    let visibleCount = 0;
    posts.forEach((post, idx) => {
      const postId = postIds[idx] || '';
      // 检查文章ID是否匹配
      const isMatch = matchedPostIds.has(postId) ||
                      Array.from(matchedPostIds).some(id => postId.includes(id) || id.includes(postId));
      post.style.display = isMatch ? '' : 'none';
      if (isMatch) visibleCount++;
    });

    showNoMatching(visibleCount === 0);
  }

  function showNoMatching(show) {
    const noMatch = document.querySelector('.listing-no-matching');
    if (noMatch) {
      noMatch.classList.toggle('d-none', !show);
    }
  }

  // ---------- 成功反馈 ----------

  function showSuccessToast(message) {
    const toast = document.createElement('div');
    toast.className = 'category-toast-success';
    toast.innerHTML = `
      <span class="toast-icon">✓</span>
      <span class="toast-msg">${escapeHtml(message)}</span>
    `;
    document.body.appendChild(toast);

    // 动画进入
    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    // 自动消失
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  // ---------- 错误提示 ----------

  function showError(errorDiv, message) {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
  }

  function hideError(errorDiv) {
    if (errorDiv) {
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
    }
  }

  // ---------- 跨页面同步 ----------

  function syncToOtherPages() {
    // 通过 storage 事件实现跨标签页同步
    localStorage.setItem('site-categories-sync', Date.now().toString());
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'site-categories-sync' || 
        e.key === POST_CATEGORIES_KEY || 
        e.key === CATEGORY_INDEX_KEY) {
      // 重新同步列表页分类
      if (document.querySelector('.quarto-listing')) {
        syncListPageCategories();
      }
    }
  });

  // 监听自定义事件
  document.addEventListener('post-categories-changed', () => {
    if (document.querySelector('.quarto-listing')) {
      syncListPageCategories();
    }
  });

  // ---------- 工具函数 ----------

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  // ---------- 初始化 ----------

  function init() {
    // 确保分类索引是最新的
    rebuildCategoryIndex();

    if (document.querySelector('.quarto-listing')) {
      // 列表页：等待listing渲染完成后再同步分类
      waitForListingReady().then(() => {
        syncListPageCategories();
      });

      // 监听原生分类按钮点击
      document.addEventListener('click', (e) => {
        const catBtn = e.target.closest('.quarto-listing-category .category');
        if (catBtn) {
          const category = catBtn.getAttribute('data-category') || '';
          filterPostsByCategory(category, catBtn);
        }
      }, true);
    } else {
      // 详情页：构建分类输入器
      buildPageCategorySelector();
    }
  }

  // 等待Quarto listing完全渲染
  function waitForListingReady() {
    return new Promise((resolve) => {
      // 检查listing是否已经初始化
      const checkInterval = setInterval(() => {
        const listing = document.querySelector('.quarto-listing');
        const posts = document.querySelectorAll('.quarto-post');
        const categoryContainer = document.querySelector('.quarto-listing-category');
        
        if (listing && posts.length > 0 && categoryContainer) {
          clearInterval(checkInterval);
          resolve();
        }
      }, 100);

      // 超时设置（5秒）
      setTimeout(() => {
        clearInterval(checkInterval);
        resolve(); // 即使超时也继续执行
      }, 5000);
    });
  }

  // ---------- 成功提示样式注入 ----------

  function injectToastStyles() {
    if (document.getElementById('category-toast-styles')) return;
    
    const style = document.createElement('style');
    style.id = 'category-toast-styles';
    style.textContent = `
      .category-toast-success {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--accent);
        color: #fff;
        padding: 0.75rem 1.2rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        pointer-events: none;
      }
      .category-toast-success.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .category-toast-success .toast-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        font-size: 0.8rem;
      }
    `;
    document.head.appendChild(style);
  }

  // 成功提示样式注入
  injectToastStyles();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(init, 200));
  } else {
    setTimeout(init, 200);
  }

  // 页面导航变化时重新初始化
  document.addEventListener('page:navigate', () => {
    setTimeout(init, 300);
  });

  // 监听分类容器变化，确保自定义分类不被覆盖
  let syncTimeout = null;
  const categoryObserver = new MutationObserver((mutations) => {
    // 检查是否是分类容器的变化
    const categoryContainer = document.querySelector('.quarto-listing-category');
    if (!categoryContainer) return;

    // 检查变化是否发生在分类容器内
    const isCategoryChange = mutations.some(m => 
      m.target.classList && m.target.classList.contains('quarto-listing-category')
    );

    if (isCategoryChange || (document.querySelector('.quarto-listing') && document.querySelector('.quarto-post'))) {
      // 防抖处理
      if (syncTimeout) clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        syncListPageCategories();
      }, 200);
    }
  });

  // 监听整个body，但只在关键变化时触发
  categoryObserver.observe(document.body, { 
    childList: true, 
    subtree: true 
  });

  // 额外监听：直接监听分类容器
  const startCategoryContainerObserver = () => {
    const categoryContainer = document.querySelector('.quarto-listing-category');
    if (categoryContainer) {
      new MutationObserver(() => {
        // 当分类容器被修改时，重新同步
        if (syncTimeout) clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
          syncListPageCategories();
        }, 100);
      }).observe(categoryContainer, { childList: true, subtree: true });
    }
  };

  // 页面加载后启动容器监听
  setTimeout(startCategoryContainerObserver, 1000);
}());

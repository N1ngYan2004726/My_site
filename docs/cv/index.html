<script>
// 主题切换逻辑
(function() {
  'use strict';
  
  const STORAGE_KEY = 'site-theme';
  
  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }
  
  function setStoredTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
  }
  
  function getPreferredTheme() {
    const stored = getStoredTheme();
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  
  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
      document.body.classList.add('quarto-dark');
      document.body.classList.remove('quarto-light');
    } else {
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-bs-theme', 'light');
      document.body.classList.remove('quarto-dark');
      document.body.classList.add('quarto-light');
    }
  }
  
  // 查找主题切换按钮的多种方式
  function findToggleButton() {
    // 方式1: 通过图标类名查找
    const icon = document.querySelector('i.bi-circle-half, .bi-circle-half');
    if (icon) {
      const btn = icon.closest('a');
      if (btn) return btn;
    }
    
    // 方式2: 通过 aria-label 查找
    const btnByLabel = document.querySelector('[aria-label="切换主题"], [aria-label="Toggle theme"]');
    if (btnByLabel) return btnByLabel;
    
    // 方式3: 通过 data-theme-toggle 属性查找
    const btnByAttr = document.querySelector('[data-theme-toggle]');
    if (btnByAttr) return btnByAttr;
    
    // 方式4: 查找导航栏中包含 circle-half 图标的链接
    const navLinks = document.querySelectorAll('.navbar a.nav-link');
    for (const link of navLinks) {
      if (link.querySelector('.bi-circle-half') || link.querySelector('i[class*="circle"]')) {
        return link;
      }
    }
    
    return null;
  }
  
  // 绑定点击事件
  function bindToggleButton() {
    const toggleBtn = findToggleButton();
    if (toggleBtn) {
      toggleBtn.id = 'theme-toggle';
      // 移除可能的默认行为
      toggleBtn.setAttribute('href', '#');
      
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const isDark = document.documentElement.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        applyTheme(newTheme);
        setStoredTheme(newTheme);
        // 触发自定义事件以便其他组件响应
        document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: newTheme } }));
      });
      
      return true;
    }
    return false;
  }
  
  // 初始化主题
  const initialTheme = getPreferredTheme();
  applyTheme(initialTheme);
  setStoredTheme(initialTheme);
  
  // 立即尝试绑定
  if (!bindToggleButton()) {
    // 如果立即绑定失败，等待DOM加载完成后重试
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindToggleButton);
    } else {
      // 延迟一点时间后重试
      setTimeout(bindToggleButton, 100);
    }
  }
  
  // 监听系统主题变化
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!getStoredTheme()) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });
})();
</script>
<script>
// Listing 年份分组：将 Quarto listing 文章按年份分组，并在侧边栏添加年份导航
(function() {
  'use strict';

  function groupListingByYear() {
    var listing = document.querySelector('.quarto-listing');
    if (!listing) return;

    var posts = listing.querySelectorAll('.quarto-post');
    if (posts.length === 0) return;

    // 收集每个文章的年份
    var yearGroups = {};
    var postArray = Array.prototype.slice.call(posts);

    postArray.forEach(function(post) {
      var dateEl = post.querySelector('.listing-date, .date');
      var dateText = dateEl ? dateEl.textContent.trim() : '';
      var year = '';

      // 尝试从日期文本中提取年份
      var match = dateText.match(/(\d{4})/);
      if (match) {
        year = match[1];
      } else {
        // 尝试从 metadata 属性中获取
        var meta = post.querySelector('.metadata');
        if (meta) {
          var metaMatch = meta.textContent.match(/(\d{4})/);
          if (metaMatch) year = metaMatch[1];
        }
      }

      if (!year) year = '其他';

      if (!yearGroups[year]) {
        yearGroups[year] = [];
      }
      yearGroups[year].push(post);
    });

    // 按年份降序排序
    var sortedYears = Object.keys(yearGroups).sort(function(a, b) {
      return parseInt(b) - parseInt(a);
    });

    if (sortedYears.length <= 1 && sortedYears[0] === '其他') return;

    // 创建年份分组
    var listingContainer = posts[0].parentElement;

    sortedYears.forEach(function(year) {
      var yearHeader = document.createElement('h2');
      yearHeader.className = 'listing-year-header';
      yearHeader.id = 'year-' + year;
      yearHeader.textContent = year;
      yearHeader.style.cssText = 'font-size:1.4rem;font-weight:600;color:var(--text);margin-top:2rem;margin-bottom:0.5rem;padding-bottom:0.3rem;border-bottom:2px solid var(--accent-soft);';

      // 在该年份的第一个文章前插入标题
      var firstPost = yearGroups[year][0];
      listingContainer.insertBefore(yearHeader, firstPost);

      // 为该年份的所有文章添加 data-year 属性
      yearGroups[year].forEach(function(post) {
        post.setAttribute('data-year', year);
      });
    });

    // 在侧边栏添加年份导航
    var sidebar = document.querySelector('#quarto-margin-sidebar, .margin-sidebar');
    if (sidebar) {
      var yearNav = document.createElement('nav');
      yearNav.className = 'listing-year-nav';
      yearNav.innerHTML = '<h3 class="listing-year-title" style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:0.4rem;margin-bottom:0.6rem;">Years</h3>';

      var yearList = document.createElement('ul');
      yearList.style.cssText = 'list-style:none;padding-left:0;';

      sortedYears.forEach(function(year) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#year-' + year;
        a.textContent = year;
        a.style.cssText = 'color:var(--muted);text-decoration:none;font-size:0.85rem;display:block;padding:0.2rem 0.5rem;border-radius:4px;transition:all 0.2s ease;';
        a.addEventListener('mouseenter', function() {
          a.style.color = 'var(--accent)';
          a.style.background = 'var(--accent-soft)';
        });
        a.addEventListener('mouseleave', function() {
          a.style.color = 'var(--muted)';
          a.style.background = 'transparent';
        });
        li.appendChild(a);
        yearList.appendChild(li);
      });

      yearNav.appendChild(yearList);

      // 插入到侧边栏顶部（在分类筛选之前）
      var firstChild = sidebar.firstElementChild;
      if (firstChild) {
        sidebar.insertBefore(yearNav, firstChild);
      } else {
        sidebar.appendChild(yearNav);
      }
    }
  }

  // 等待 Quarto listing 渲染完成后执行
  function init() {
    // 立即尝试
    if (document.querySelector('.quarto-post')) {
      groupListingByYear();
      return;
    }

    // 使用 MutationObserver 等待 listing 渲染
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('.quarto-post')) {
        groupListingByYear();
        obs.disconnect();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    // 超时后停止观察
    setTimeout(function() {
      observer.disconnect();
      if (document.querySelector('.quarto-post') && !document.querySelector('.listing-year-header')) {
        groupListingByYear();
      }
    }, 5000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

              // This should only happen for chapter cross references
              // (since there is no id in the URL)
              // remove the first header
              if (note.children.length > 0 && note.children[0].tagName === "HEADER") {
                note.children[0].remove();
              }
              const html = processXRef(null, note);
              instance.setContent(html);
            } 
          }).finally(() => {
            instance.enable();
            instance.show();
          });
        }
      }, function(instance) {
      });
    }
        let selectedAnnoteEl;
        const selectorForAnnotation = ( cell, annotation) => {
          let cellAttr = 'data-code-cell="' + cell + '"';
          let lineAttr = 'data-code-annotation="' +  annotation + '"';
          const selector = 'span[' + cellAttr + '][' + lineAttr + ']';
          return selector;
        }
        const selectCodeLines = (annoteEl) => {
          const doc = window.document;
          const targetCell = annoteEl.getAttribute("data-target-cell");
          const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
          const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));
          const lines = annoteSpan.getAttribute("data-code-lines").split(",");
          const lineIds = lines.map((line) => {
            return targetCell + "-" + line;
          })
          let top = null;
          let height = null;
          let parent = null;
          if (lineIds.length > 0) {
              //compute the position of the single el (top and bottom and make a div)
              const el = window.document.getElementById(lineIds[0]);
              top = el.offsetTop;
              height = el.offsetHeight;
              parent = el.parentElement.parentElement;
            if (lineIds.length > 1) {
              const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
              const bottom = lastEl.offsetTop + lastEl.offsetHeight;
              height = bottom - top;
            }
            if (top !== null && height !== null && parent !== null) {
              // cook up a div (if necessary) and position it 
              let div = window.document.getElementById("code-annotation-line-highlight");
              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }

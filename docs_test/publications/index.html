<script>
/**
 * Handwriting Pixel Art Welcome Overlay v4.0
 * - Pure white background
 * - Handwritten fonts with pixel block effect
 * - Animated handwriting simulation with variable speed
 */
(function() {
  'use strict';

  var SESSION_KEY = 'ny_welcomed_pixel_v4';
  var BLOCK = 16;

  var isHomePage = function() {
    var p = window.location.pathname;
    return p === '/' || p.endsWith('/index.html') || p === '' || /\/index\.html?$/.test(p);
  };

  var init = function() {
    if (!isHomePage()) return;
    if (sessionStorage.getItem(SESSION_KEY)) return;

    var o = document.createElement('div');
    o.className = 'hw-overlay';
    o.innerHTML =
      '<div class="hw-bg"></div>' +
      '<div class="hw-text-layer" id="hwTextLayer">' +
        '<div class="hw-text-cn">你好</div>' +
        '<div class="hw-text-en">N1ngYan</div>' +
      '</div>' +
      '<canvas class="hw-canvas" id="hwCanvas"></canvas>' +
      '<button class="hw-enter" type="button" id="hwEnter">' +
        '<span class="hw-enter-label">▶ PRESS START</span>' +
      '</button>' +
      '<div class="hw-hint" id="hwHint">[ CLICK OR PRESS ENTER ]</div>' +
      '<div class="hw-cursor" id="hwCursor"></div>';

    document.body.appendChild(o);
    document.body.style.overflow = 'hidden';

    injectStyles();
    setTimeout(function() { o.classList.add('hw-ready'); }, 30);
    loadFontsAndStart();

    var btn = document.getElementById('hwEnter');
    btn.addEventListener('click', function() { enterSite(o); });
    document.addEventListener('keydown', function keyHandler(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        enterSite(o);
        document.removeEventListener('keydown', keyHandler);
      }
    });
  };

  var enterSite = function(o) {
    if (o.classList.contains('hw-exiting')) return;
    o.classList.add('hw-exiting');
    document.body.style.overflow = '';
    sessionStorage.setItem(SESSION_KEY, 'true');
    stopAnim();
    setTimeout(function() {
      if (o.parentNode) o.parentNode.removeChild(o);
    }, 700);
  };

  /* ---- Animation state ---- */
  var rafId = null;
  var blocksData = null;
  var pen = null;
  var canvas = null;
  var ctx = null;
  var W = 0, H = 0;

  var loadFontsAndStart = function() {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Long+Cang&family=Caveat:wght@700&family=Pacifico&family=Zhi+Mang+Xing&display=swap';
    document.head.appendChild(link);

    var startAfterLoad = function() {
      if (document.fonts && document.fonts.load) {
        Promise.all([
          document.fonts.load('400 48px "Ma Shan Zheng"'),
          document.fonts.load('400 48px "Long Cang"'),
          document.fonts.load('400 48px "Zhi Mang Xing"'),
          document.fonts.load('700 48px "Caveat"'),
          document.fonts.load('400 48px "Pacifico"')
        ]).then(function() {
          setTimeout(function() {
            try {
              startAnim();
            } catch(e) {
              console.error('startAnim error:', e);
            }
          }, 300);
        }).catch(function() {
          setTimeout(startAnim, 2000);
        });
      } else {
        setTimeout(startAnim, 3000);
      }
    };
    startAfterLoad();
  };

  /* ---- Core animation ---- */
  var startAnim = function() {
    canvas = document.getElementById('hwCanvas');
    ctx = canvas.getContext('2d');
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    // Build pixel data
    blocksData = buildPixelData(W, H);
    console.log('[HW] block count:', blocksData.blocks.length, 'totalDuration:', blocksData.totalDuration + 'ms');

    // Start the reveal animation
    runReveal();
  };

  var stopAnim = function() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  };

  /* ---- Build pixel data from text ---- */
  var buildPixelData = function(W, H) {
    var gridW = Math.floor(W / BLOCK);
    var gridH = Math.floor(H / BLOCK);
    var SS = 3;

    var ssCanvas = document.createElement('canvas');
    ssCanvas.width = gridW * SS;
    ssCanvas.height = gridH * SS;
    var ssc = ssCanvas.getContext('2d');

    ssc.fillStyle = '#FFFFFF';
    ssc.fillRect(0, 0, ssCanvas.width, ssCanvas.height);

    var cnFontSz = Math.floor(gridH * 0.38) * SS;
    var enFontSz = Math.floor(gridH * 0.32) * SS;
    var gapSz = Math.floor(gridH * 0.05) * SS;

    var totalH = cnFontSz + gapSz + enFontSz;
    var startY = Math.floor((ssCanvas.height - totalH) / 2);

    ssc.fillStyle = '#1a1a1a';
    ssc.textAlign = 'center';
    ssc.textBaseline = 'alphabetic';

    var cx = Math.floor(ssCanvas.width / 2);
    var cy1 = startY + Math.floor(cnFontSz * 0.85);
    ssc.font = cnFontSz + "px 'Ma Shan Zheng','Long Cang','Zhi Mang Xing',cursive";
    ssc.fillText('你好', cx, cy1);

    var cy2 = startY + cnFontSz + gapSz + Math.floor(enFontSz * 0.85);
    ssc.font = enFontSz + "px 'Caveat','Pacifico',cursive";
    ssc.fillText('N1ngYan', cx, cy2);

    // Manual box-average downsampling with better threshold
    var ssImg = ssc.getImageData(0, 0, ssCanvas.width, ssCanvas.height).data;
    var rawBlocks = [];

    for (var gy = 0; gy < gridH; gy++) {
      for (var gx = 0; gx < gridW; gx++) {
        var sumA = 0, count = 0;
        var startSy = gy * SS;
        var startSx = gx * SS;
        for (var sy = startSy; sy < startSy + SS && sy < ssCanvas.height; sy++) {
          for (var sx = startSx; sx < startSx + SS && sx < ssCanvas.width; sx++) {
            var si = (sy * ssCanvas.width + sx) * 4;
            sumA += ssImg[si + 3];
            count++;
          }
        }
        var avgA = sumA / count;
        if (avgA > 100) {
          rawBlocks.push({
            lx: gx,
            ly: gy,
            px: gx * BLOCK,
            py: gy * BLOCK,
            alpha: avgA / 255
          });
        }
      }
    }

    // Also try a second pass with lower threshold for thin strokes
    // (We keep only the >100 threshold for cleaner results)

    var groups = partitionBlocks(rawBlocks, gridW, gridH, cy1 / SS, cnFontSz / SS, cy2 / SS, enFontSz / SS);

    var all = [];
    var charStart = 0;

    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      var count = grp.length;
      if (count === 0) continue;

      grp.sort(function(a, b) {
        var colDiff = a.lx - b.lx;
        if (Math.abs(colDiff) <= 2) {
          return a.ly - b.ly;
        }
        return colDiff;
      });

      var shuffled = [];
      var chunkSize = 6 + Math.floor(Math.random() * 6);
      for (var i = 0; i < grp.length; i += chunkSize) {
        var chunk = grp.slice(i, Math.min(i + chunkSize, grp.length));
        if (Math.random() > 0.5) {
          chunk.reverse();
        }
        shuffled = shuffled.concat(chunk);
      }

      var charDuration;
      if (g === 0) {
        charDuration = Math.max(3000, count * 3.5);
      } else if (g === 1) {
        charDuration = Math.max(1500, count * 2.8);
      } else {
        charDuration = Math.max(2500, count * 3.0);
      }

      var pauseBefore = charStart;
      for (var j = 0; j < shuffled.length; j++) {
        var rel = j / shuffled.length;
        var eased = rel < 0.5
          ? 2 * rel * rel
          : 1 - Math.pow(-2 * rel + 2, 2) / 2;

        var speedVar = 0.5 + Math.random() * 1.0;
        var t = pauseBefore + eased * charDuration / speedVar;

        shuffled[j].writeTime = t;
        shuffled[j].color = '#1a1a1a';
        shuffled[j].groupIdx = g;
        all.push(shuffled[j]);
      }

      charStart = pauseBefore + charDuration + 250 + Math.random() * 200;
    }

    all.sort(function(a, b) { return a.writeTime - b.writeTime; });

    console.log('[HW DEBUG] blocks:', all.length, 'totalDuration:', Math.round(charStart + 600) + 'ms', 'gridW:', gridW, 'gridH:', gridH);

    return { blocks: all, totalDuration: charStart + 600 };
  };

  var partitionBlocks = function(raw, lrW, lrH, cy1, cnSz, cy2, enSz) {
    var gCn = [], gSp = [], gEn = [];

    for (var i = 0; i < raw.length; i++) {
      var b = raw[i];
      // Chinese char region
      if (b.ly >= cy1 - cnSz && b.ly <= cy1 + cnSz * 0.5) {
        gCn.push(b);
      }
      // English char region
      else if (b.ly >= cy2 - enSz && b.ly <= cy2 + enSz * 0.5) {
        gEn.push(b);
      }
      // In-between gap area (likely connecting strokes or flourishes)
      else if (b.ly > cy1 + cnSz * 0.3 && b.ly < cy2 - enSz * 0.3) {
        gSp.push(b);
      } else {
        // Default to nearest group
        if (Math.abs(b.ly - cy1) < Math.abs(b.ly - cy2)) {
          gCn.push(b);
        } else {
          gEn.push(b);
        }
      }
    }

    return [gCn, gSp, gEn];
  };

  /* ---- Reveal animation loop ---- */
  var runReveal = function() {
    var blocks = blocksData.blocks;
    var total = blocksData.totalDuration;
    var startTs = null;
    var lastDrawnIdx = -1;
    var penAngle = -Math.PI / 4;

    var frame = function(ts) {
      if (!startTs) startTs = ts;
      var elapsed = ts - startTs;

      // Clear to transparent (let handwritten text show through)
      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;

      // Draw all blocks whose writeTime <= elapsed
      var currentIdx = lastDrawnIdx;

      for (var i = 0; i < blocks.length; i++) {
        if (blocks[i].writeTime <= elapsed) {
          ctx.globalAlpha = blocks[i].alpha || 1.0;
          ctx.fillStyle = blocks[i].color;
          ctx.fillRect(blocks[i].px, blocks[i].py, BLOCK, BLOCK);
          currentIdx = i;
        } else {
          break;
        }
      }
      ctx.globalAlpha = 1.0;

      // Draw pen tip directly on canvas at the last drawn block
      if (currentIdx >= 0 && currentIdx !== lastDrawnIdx) {
        var lb = blocks[currentIdx];
        var px = lb.px + BLOCK * 0.5;
        var py = lb.py - BLOCK * 0.3;
        var len = BLOCK * 2.2;

        penAngle += (Math.random() - 0.5) * 0.3;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(penAngle);

        // Pen glow
        ctx.shadowColor = 'rgba(230,81,0,0.5)';
        ctx.shadowBlur = BLOCK * 0.6;

        // Pen body
        ctx.fillStyle = '#E65100';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-len * 0.8, len * 0.25);
        ctx.lineTo(-len, len * 0.05);
        ctx.lineTo(-len * 0.2, -len * 0.15);
        ctx.closePath();
        ctx.fill();

        // Pen tip
        ctx.fillStyle = '#BF360C';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-len * 0.2, len * 0.15);
        ctx.lineTo(-len * 0.3, len * 0.05);
        ctx.closePath();
        ctx.fill();

        // Ink dot
        ctx.fillStyle = 'rgba(230,81,0,0.6)';
        ctx.beginPath();
        ctx.arc(0, 0, BLOCK * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      lastDrawnIdx = currentIdx;

      if (elapsed < total) {
        rafId = requestAnimationFrame(frame);
      } else {
        // Animation complete
        showEnterButton();
      }
    };

    rafId = requestAnimationFrame(frame);
  };

  var showEnterButton = function() {
    var btn = document.getElementById('hwEnter');
    var hint = document.getElementById('hwHint');
    var textLayer = document.getElementById('hwTextLayer');
    btn.classList.add('hw-visible');
    hint.classList.add('hw-visible');
    if (textLayer) {
      textLayer.style.transition = 'opacity 0.8s ease-out';
      textLayer.style.opacity = '0.5';
    }
  };

  /* ---- Styles ---- */
  var injectStyles = function() {
    if (document.getElementById('hw-welcome-styles')) return;

    var s = document.createElement('style');
    s.id = 'hw-welcome-styles';
    s.textContent = [

      '.hw-overlay{',
      'position:fixed;inset:0;z-index:9998;',
      'display:flex;align-items:center;justify-content:center;',
      'background:#FFFFFF;',
      'opacity:0;transition:opacity 0.4s steps(4);',
      '}',
      '.hw-overlay.hw-ready{opacity:1;}',
      '.hw-overlay.hw-exiting{',
      'opacity:0;transition:opacity 0.6s steps(6);',
      'pointer-events:none;',
      '}',

      '.hw-bg{',
      'position:absolute;inset:0;',
      'background:#FFFFFF;',
      '}',

      '.hw-text-layer{',
      'position:absolute;inset:0;',
      'display:flex;flex-direction:column;',
      'align-items:center;justify-content:center;',
      'z-index:1;',
      'pointer-events:none;',
      '}',
      '.hw-text-cn{',
      'font-family:"Ma Shan Zheng","Long Cang","Zhi Mang Xing",cursive;',
      'font-size:28vh;',
      'color:#1a1a1a;',
      'line-height:1;',
      'margin-bottom:1.5vh;',
      'text-align:center;',
      '}',
      '.hw-text-en{',
      'font-family:"Caveat","Pacifico",cursive;',
      'font-size:24vh;',
      'color:#1a1a1a;',
      'line-height:1;',
      'text-align:center;',
      '}',

      '.hw-canvas{',
      'position:absolute;inset:0;',
      'z-index:3;',
      'image-rendering:pixelated;',
      'image-rendering:-moz-crisp-edges;',
      'image-rendering:crisp-edges;',
      '}',

      /* Pen tip indicator */
      '.hw-pen{',
      'position:absolute;',
      'width:' + (BLOCK * 2) + 'px;height:' + (BLOCK * 2) + 'px;',

<script>
// 主题切换逻辑
(function() {
  'use strict';
  
  const STORAGE_KEY = 'site-theme';
  
  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }
  
  function setStoredTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
  }
  
  function getPreferredTheme() {
    const stored = getStoredTheme();
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  
  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-bs-theme', 'dark');
      document.body.classList.add('quarto-dark');
      document.body.classList.remove('quarto-light');
    } else {
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-bs-theme', 'light');
      document.body.classList.remove('quarto-dark');
      document.body.classList.add('quarto-light');
    }
  }
  
  // 查找主题切换按钮的多种方式
  function findToggleButton() {
    // 方式1: 通过图标类名查找
    const icon = document.querySelector('i.bi-circle-half, .bi-circle-half');
    if (icon) {
      const btn = icon.closest('a');
      if (btn) return btn;
    }
    
    // 方式2: 通过 aria-label 查找
    const btnByLabel = document.querySelector('[aria-label="切换主题"], [aria-label="Toggle theme"]');
    if (btnByLabel) return btnByLabel;
    
    // 方式3: 通过 data-theme-toggle 属性查找
    const btnByAttr = document.querySelector('[data-theme-toggle]');
    if (btnByAttr) return btnByAttr;
    
    // 方式4: 查找导航栏中包含 circle-half 图标的链接
    const navLinks = document.querySelectorAll('.navbar a.nav-link');
    for (const link of navLinks) {
      if (link.querySelector('.bi-circle-half') || link.querySelector('i[class*="circle"]')) {
        return link;
      }
    }
    
    return null;
  }
  
  // 绑定点击事件
  function bindToggleButton() {
    const toggleBtn = findToggleButton();
    if (toggleBtn) {
      toggleBtn.id = 'theme-toggle';
      // 移除可能的默认行为
      toggleBtn.setAttribute('href', '#');
      
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const isDark = document.documentElement.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        applyTheme(newTheme);
        setStoredTheme(newTheme);
        // 触发自定义事件以便其他组件响应
        document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: newTheme } }));
      });
      
      return true;
    }
    return false;
  }
  
  // 初始化主题
  const initialTheme = getPreferredTheme();
  applyTheme(initialTheme);
  setStoredTheme(initialTheme);
  
  // 立即尝试绑定
  if (!bindToggleButton()) {
    // 如果立即绑定失败，等待DOM加载完成后重试
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindToggleButton);
    } else {
      // 延迟一点时间后重试
      setTimeout(bindToggleButton, 100);
    }
  }
  
  // 监听系统主题变化
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!getStoredTheme()) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });
})();
</script>
<script>

// Listing 年份分组：将 Quarto listing 文章按年份分组，并在侧边栏添加年份导航

(function() {

  'use strict';



  function groupListingByYear() {

    var listing = document.querySelector('.quarto-listing');

    if (!listing) return;



    var posts = listing.querySelectorAll('.quarto-post');

    if (posts.length === 0) return;



    // 收集每个文章的年份

    var yearGroups = {};

    var postArray = Array.prototype.slice.call(posts);



    postArray.forEach(function(post) {

      var dateEl = post.querySelector('.listing-date, .date');

      var dateText = dateEl ? dateEl.textContent.trim() : '';

      var year = '';



      // 尝试从日期文本中提取年份

      var match = dateText.match(/(\d{4})/);

      if (match) {

        year = match[1];

      } else {

        // 尝试从 metadata 属性中获取

        var meta = post.querySelector('.metadata');

        if (meta) {

          var metaMatch = meta.textContent.match(/(\d{4})/);

          if (metaMatch) year = metaMatch[1];

        }

      }



      if (!year) year = '其他';



      if (!yearGroups[year]) {

        yearGroups[year] = [];

      }

      yearGroups[year].push(post);

    });



    // 按年份降序排序

    var sortedYears = Object.keys(yearGroups).sort(function(a, b) {

      return parseInt(b) - parseInt(a);

    });



    if (sortedYears.length <= 1 && sortedYears[0] === '其他') return;



    // 创建年份分组

    var listingContainer = posts[0].parentElement;



    sortedYears.forEach(function(year) {

      var yearHeader = document.createElement('h2');

      yearHeader.className = 'listing-year-header';

      yearHeader.id = 'year-' + year;

      yearHeader.textContent = year;

      yearHeader.style.cssText = 'font-size:1.4rem;font-weight:600;color:var(--text);margin-top:2rem;margin-bottom:0.5rem;padding-bottom:0.3rem;border-bottom:2px solid var(--accent-soft);';



      // 在该年份的第一个文章前插入标题

      var firstPost = yearGroups[year][0];

      listingContainer.insertBefore(yearHeader, firstPost);



      // 为该年份的所有文章添加 data-year 属性

      yearGroups[year].forEach(function(post) {

        post.setAttribute('data-year', year);

      });

    });



    // 在侧边栏添加年份导航

    var sidebar = document.querySelector('#quarto-margin-sidebar, .margin-sidebar');

    if (sidebar) {

      var yearNav = document.createElement('nav');

      yearNav.className = 'listing-year-nav';

      yearNav.innerHTML = '<h3 class="listing-year-title" style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:0.4rem;margin-bottom:0.6rem;">Years</h3>';



      var yearList = document.createElement('ul');

      yearList.style.cssText = 'list-style:none;padding-left:0;';



      sortedYears.forEach(function(year) {

        var li = document.createElement('li');

        var a = document.createElement('a');

        a.href = '#year-' + year;

        a.textContent = year;

        a.style.cssText = 'color:var(--muted);text-decoration:none;font-size:0.85rem;display:block;padding:0.2rem 0.5rem;border-radius:4px;transition:all 0.2s ease;';

        a.addEventListener('mouseenter', function() {

          a.style.color = 'var(--accent)';

          a.style.background = 'var(--accent-soft)';

        });

        a.addEventListener('mouseleave', function() {

          a.style.color = 'var(--muted)';

          a.style.background = 'transparent';

        });

        li.appendChild(a);

        yearList.appendChild(li);

      });



      yearNav.appendChild(yearList);



      // 插入到侧边栏顶部（在分类筛选之前）

      var firstChild = sidebar.firstElementChild;

      if (firstChild) {

        sidebar.insertBefore(yearNav, firstChild);

      } else {

        sidebar.appendChild(yearNav);

      }

    }

  }



  // 等待 Quarto listing 渲染完成后执行

  function init() {

    // 立即尝试

    if (document.querySelector('.quarto-post')) {

      groupListingByYear();

      return;

    }



    // 使用 MutationObserver 等待 listing 渲染

    var observer = new MutationObserver(function(mutations, obs) {

      if (document.querySelector('.quarto-post')) {

        groupListingByYear();

        obs.disconnect();

      }

    });



    observer.observe(document.body, {

      childList: true,

      subtree: true

    });



    // 超时后停止观察

    setTimeout(function() {

      observer.disconnect();

      if (document.querySelector('.quarto-post') && !document.querySelector('.listing-year-header')) {

        groupListingByYear();

      }

    }, 5000);

  }



  if (document.readyState === 'loading') {

    document.addEventListener('DOMContentLoaded', init);

  } else {

    init();

  }

})();

</script>

<script>
/**
 * Image Lightbox v2.0
 * Features:
 *   - Click any image in main.content to zoom
 *   - Wheel/pinch zoom, drag pan, double-tap toggle
 *   - Swipe gestures, keyboard nav, ESC close
 *   - Loading spinner, zoom indicator, image counter
 */
(function() {
  'use strict';

  var modal = null;
  var modalImg = null;
  var overlay = null;
  var closeBtn = null;
  var zoomIndicator = null;
  var counter = null;
  var loadingSpinner = null;

  var images = [];
  var currentIndex = 0;
  var scale = 1;
  var translateX = 0;
  var translateY = 0;
  var isDragging = false;
  var dragStartX = 0;
  var dragStartY = 0;
  var dragStartTranslateX = 0;
  var dragStartTranslateY = 0;
  var initialPinchDistance = 0;
  var initialScale = 1;
  var animFrame = null;

  function init() {
    images = Array.prototype.slice.call(
      document.querySelectorAll('main.content img')
    ).filter(function(img) {
      return !img.closest('.no-lightbox') && img.src;
    });

    if (images.length === 0) return;

    buildModal();
    bindEvents();
  }

  function buildModal() {
    modal = document.createElement('div');
    modal.className = 'lightbox-modal';
    modal.innerHTML =
      '<div class="lb-overlay"></div>' +
      '<div class="lb-container">' +
        '<img class="lb-image" alt="">' +
      '</div>' +
      '<div class="lb-loading"></div>' +
      '<button class="lb-close" aria-label="关闭">&times;</button>' +
      '<div class="lb-controls">' +
        '<span class="lb-zoom-indicator">100%</span>' +
        '<span class="lb-counter"></span>' +
      '</div>';

    document.body.appendChild(modal);
    overlay = modal.querySelector('.lb-overlay');
    modalImg = modal.querySelector('.lb-image');
    closeBtn = modal.querySelector('.lb-close');
    zoomIndicator = modal.querySelector('.lb-zoom-indicator');
    counter = modal.querySelector('.lb-counter');
    loadingSpinner = modal.querySelector('.lb-loading');
  }

  function bindEvents() {
    images.forEach(function(img, index) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function(e) {
        e.preventDefault();
        open(index);
      });
    });

    overlay.addEventListener('click', close);
    closeBtn.addEventListener('click', close);
    modalImg.addEventListener('dblclick', onDoubleClick);
    modalImg.addEventListener('wheel', onWheel, { passive: false });

    modalImg.addEventListener('touchstart', onTouchStart, { passive: false });
    modalImg.addEventListener('touchmove', onTouchMove, { passive: false });
    modalImg.addEventListener('touchend', onTouchEnd);

    modalImg.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);

    document.addEventListener('keydown', onKeyDown);

    modal.addEventListener('transitionend', function(e) {
      if (e.target === modal && modal.classList.contains('visible')) {
        modal.style.opacity = '1';
      }
    });
  }

  function open(index) {
    currentIndex = index;
    var img = images[index];

    modalImg.src = img.src;
    modalImg.alt = img.alt || '';
    modalImg.style.transform = '';
    scale = 1;
    translateX = 0;
    translateY = 0;

    updateZoomIndicator();
    updateCounter();
    showLoading(true);

    modal.classList.add('visible');
    document.body.style.overflow = 'hidden';

    modalImg.addEventListener('load', function onLoad() {
      showLoading(false);
      modalImg.removeEventListener('load', onLoad);
    });
  }

  function close() {
    modal.classList.remove('visible');
    modalImg.style.transform = '';
    scale = 1;
    translateX = 0;
    translateY = 0;
    document.body.style.overflow = '';
  }

  function onDoubleClick() {
    if (scale === 1) {
      setScale(2);
    } else {
      setScale(1);
    }
  }

  function onWheel(e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.15 : 0.15;
    var newScale = Math.max(0.5, Math.min(5, scale + delta));
    setScale(newScale);
  }

  function setScale(newScale) {
    scale = Math.round(newScale * 100) / 100;
    applyTransform();
    updateZoomIndicator();
  }

  function applyTransform() {
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(function() {
      modalImg.style.transform =
        'translate(' + translateX + 'px, ' + translateY + 'px) ' +
        'scale(' + scale + ')';
    });
  }

  function updateZoomIndicator() {
    if (zoomIndicator) {
      zoomIndicator.textContent = Math.round(scale * 100) + '%';
      zoomIndicator.style.opacity = scale === 1 ? '0.5' : '1';
    }
  }

  function updateCounter() {
    if (counter && images.length > 1) {
      counter.textContent = (currentIndex + 1) + ' / ' + images.length;
      counter.style.display = 'inline';
    } else if (counter) {
      counter.style.display = 'none';
    }
  }

  function showLoading(show) {
    if (!loadingSpinner) return;
    if (show) {
      loadingSpinner.style.display = 'block';
    } else {
      loadingSpinner.style.display = 'none';
    }
  }

  function onDragStart(e) {
    if (scale <= 1) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartTranslateX = translateX;
    dragStartTranslateY = translateY;
    modalImg.style.transition = 'none';
  }

  function onDragMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    var deltaX = e.clientX - dragStartX;
    var deltaY = e.clientY - dragStartY;
    translateX = dragStartTranslateX + deltaX;
    translateY = dragStartTranslateY + deltaY;
    applyTransform();
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    modalImg.style.transition = '';
  }

  function onTouchStart(e) {
    e.preventDefault();
    if (e.touches.length === 2) {
      var dist = getTouchDistance(e.touches[0], e.touches[1]);
      initialPinchDistance = dist;
      initialScale = scale;
    } else if (e.touches.length === 1 && scale > 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      dragStartTranslateX = translateX;
      dragStartTranslateY = translateY;
      modalImg.style.transition = 'none';
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2) {
      var dist = getTouchDistance(e.touches[0], e.touches[1]);
      if (initialPinchDistance > 0) {
        var ratio = dist / initialPinchDistance;
        setScale(Math.max(0.5, Math.min(5, initialScale * ratio)));
      }
    } else if (e.touches.length === 1 && isDragging) {
      var deltaX = e.touches[0].clientX - dragStartX;
      var deltaY = e.touches[0].clientY - dragStartY;
      translateX = dragStartTranslateX + deltaX;
      translateY = dragStartTranslateY + deltaY;
      applyTransform();
    }
  }

  function onTouchEnd() {
    isDragging = false;
    initialPinchDistance = 0;
    modalImg.style.transition = '';
  }

  function getTouchDistance(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function onKeyDown(e) {
    if (!modal.classList.contains('visible')) return;

    if (e.key === 'Escape') {
      close();
    } else if (e.key === 'ArrowRight') {
      navigate(1);
    } else if (e.key === 'ArrowLeft') {
      navigate(-1);
    } else if (e.key === '+' || e.key === '=') {
      setScale(Math.min(5, scale + 0.25));
    } else if (e.key === '-' || e.key === '_') {
      setScale(Math.max(0.5, scale - 0.25));
    } else if (e.key === '0') {
      setScale(1);
      translateX = 0;
      translateY = 0;
      applyTransform();
    }
  }

  function navigate(direction) {
    if (images.length <= 1) return;
    currentIndex = (currentIndex + direction + images.length) % images.length;
    open(currentIndex);
  }

  function injectStyles() {
    if (document.getElementById('lightbox-styles')) return;
    var style = document.createElement('style');
    style.id = 'lightbox-styles';
    style.textContent =
      '.lightbox-modal{' +
      'position:fixed;inset:0;z-index:9999;' +
      'display:flex;align-items:center;justify-content:center;' +
      'opacity:0;visibility:hidden;' +
      'transition:opacity 0.35s cubic-bezier(0.2,0.8,0.2,1),visibility 0s 0.35s;' +
      'user-select:none;-webkit-user-select:none;' +
      '}' +
      '.lightbox-modal.visible{' +
      'opacity:1;visibility:visible;' +
      'transition:opacity 0.35s cubic-bezier(0.2,0.8,0.2,1),visibility 0s 0s;' +
      '}' +
      '.lb-overlay{' +
      'position:absolute;inset:0;' +
      'background:rgba(0,0,0,0.88);' +
      'backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);' +
      '}' +
      '.lb-container{' +
      'position:relative;max-width:92vw;max-height:85vh;' +
      'display:flex;align-items:center;justify-content:center;' +
      '}' +
      '.lb-image{' +
      'max-width:92vw;max-height:85vh;' +
      'object-fit:contain;' +
      'border-radius:8px;' +
      'box-shadow:0 20px 60px rgba(0,0,0,0.5);' +
      'transform-origin:center center;' +
      'transition:transform 0.25s cubic-bezier(0.2,0.8,0.2,1);' +
      'cursor:zoom-out;' +
      '-webkit-user-drag:none;' +
      '}' +
      '.lb-image:not([src]),.lb-image[src=""]{display:none;}' +
      '.lb-close{' +
      'position:absolute;top:24px;right:24px;' +
      'width:42px;height:42px;border-radius:50%;' +
      'background:rgba(255,255,255,0.12);' +
      'border:1px solid rgba(255,255,255,0.2);' +
      'color:#ffffff;font-size:24px;font-weight:300;' +
      'cursor:pointer;display:flex;align-items:center;justify-content:center;' +
      'line-height:1;padding:0;' +
      'transition:all 0.2s ease;' +
      'z-index:10;' +
